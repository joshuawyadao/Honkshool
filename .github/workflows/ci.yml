name: Repository Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Repository Verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.classify.outputs.run_ios }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: ./scripts/verify-repository.sh

      - name: Classify changes
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci-policy.py classify --event "$CI_EVENT_NAME" --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"

  ios-tests:
    name: iOS Unit and UI Tests
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode for all iOS checks
        shell: bash
        run: |
          developer_dir="$(xcode-select -p)"
          if [[ ! -d "$developer_dir" || ! -x "$developer_dir/usr/bin/xcodebuild" ]]; then
            echo "Selected Xcode developer directory is unavailable: $developer_dir" >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\nHONKSHOOL_XCODE_PATH=%s\n' \
            "$developer_dir" "$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version

      - name: Provision owned iOS simulator
        id: simulator
        run: python3 scripts/ci-simulator.py prepare

      - name: Run iOS tests
        id: ios-tests
        env:
          HONKSHOOL_TEST_DIAGNOSTICS: on-failure
        run: ./scripts/test-ios.sh

      - name: Build unsigned Release app
        run: >-
          xcodebuild -quiet build
          -project Honkshool.xcodeproj
          -scheme Honkshool
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/HonkshoolRelease"
          CODE_SIGNING_ALLOWED=NO

      - name: Retain failed simulator test results
        if: ${{ failure() && steps.ios-tests.outputs.result_directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ steps.ios-tests.outputs.result_directory }}
          retention-days: 7
          if-no-files-found: warn

      - name: Remove owned iOS simulator
        if: ${{ always() && steps.simulator.outputs.simulator_id != '' }}
        env:
          HONKSHOOL_SIMULATOR_ID: ${{ steps.simulator.outputs.simulator_id }}
        run: python3 scripts/ci-simulator.py cleanup "$HONKSHOOL_SIMULATOR_ID"

  ci-verify:
    name: CI Verify
    needs: [verify, ios-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce CI result policy
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
          RUN_IOS: ${{ needs.verify.outputs.run_ios }}
        run: python3 scripts/ci-policy.py gate --verify "$VERIFY_RESULT" --ios "$IOS_RESULT" --run-ios "$RUN_IOS"
