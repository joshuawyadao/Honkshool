name: Repository Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Repository Verify
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: ./scripts/verify-repository.sh

  ios-tests:
    name: iOS Unit and UI Tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run iOS tests
        id: ios-tests
        env:
          HONKSHOOL_TEST_DIAGNOSTICS: on-failure
        run: ./scripts/test-ios.sh

      - name: Retain failed simulator test results
        if: ${{ failure() && steps.ios-tests.outputs.result_directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ steps.ios-tests.outputs.result_directory }}
          retention-days: 7
          if-no-files-found: warn
