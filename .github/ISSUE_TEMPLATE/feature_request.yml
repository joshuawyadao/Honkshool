name: Feature request
description: Propose a focused user outcome for Honkshool.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the user and the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would make this successful?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals
      description: Identify what should and should not be included.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, and data implications
      description: Note any new data, permissions, storage, network calls, dependencies, or failure modes.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the behaviors that would demonstrate completion.
