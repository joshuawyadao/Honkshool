name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use synthetic examples and remove credentials, personal data, and machine-specific paths. Report security vulnerabilities privately through the Security tab.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence using synthetic data.
      placeholder: |
        1. Start with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant version and platform details without usernames or private paths.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach only privacy-safe logs, screenshots, or examples.
