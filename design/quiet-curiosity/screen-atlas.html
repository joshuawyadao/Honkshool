&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;honkshool-atlas&#x27;);
  const preferences = {appearance:&#x27;System&#x27;,textSize:100,embellishment:true};
  let selected = null;
  const status = document.getElementById(&#x27;ha-preview-status&#x27;);
  function restore(snapshot) {
    if (snapshot?.privateContent?.schema !== &#x27;honkshool-atlas-v1&#x27;) return;
    const saved = snapshot.privateContent;
    if ([&#x27;System&#x27;,&#x27;Daylight&#x27;,&#x27;Evening&#x27;].includes(saved.appearance)) preferences.appearance = saved.appearance;
    if (Number.isFinite(saved.textSize)) preferences.textSize = Math.max(100,Math.min(125,saved.textSize));
    if (typeof saved.embellishment === &#x27;boolean&#x27;) preferences.embellishment = saved.embellishment;
    const savedCard=typeof saved.selected===&#x27;string&#x27; ? document.getElementById(saved.selected) : null;
    selected = savedCard &amp;&amp; root.contains(savedCard) ? saved.selected : null;
  }
  function render() {
    root.querySelectorAll(&#x27;.ha-phone&#x27;).forEach(phone =&gt; {phone.style.colorScheme = preferences.appearance === &#x27;System&#x27; ? &#x27;&#x27; : preferences.appearance === &#x27;Evening&#x27; ? &#x27;dark&#x27; : &#x27;light&#x27;;});
    root.style.setProperty(&#x27;--ha-scale&#x27;,preferences.textSize / 100);
    root.dataset.embellishment = String(preferences.embellishment);
    root.querySelectorAll(&#x27;.ha-example&#x27;).forEach(card =&gt; card.dataset.focused = String(card.id === selected));
  }
  function persist() {
    if (!window.openai?.setWidgetState) return;
    const selectedCard = selected ? document.getElementById(selected) : null;
    window.openai.setWidgetState({modelContent:{design:&#x27;Quiet curiosity · Rest first&#x27;,selectedScreen:selectedCard?.querySelector(&#x27;.ha-caption h3&#x27;)?.textContent || null,appearance:preferences.appearance,textSize:preferences.textSize,embellishment:preferences.embellishment},privateContent:{schema:&#x27;honkshool-atlas-v1&#x27;,...preferences,selected}}).catch(() =&gt; {});
  }
  restore(window.openai?.widgetState);
  const logo = JSON.parse(document.getElementById(&#x27;ha-logo-data&#x27;).textContent);
  root.querySelectorAll(&#x27;[data-logo]&#x27;).forEach(img =&gt; img.src = logo);
  root.querySelectorAll(&#x27;.ha-status &gt; span:last-child&#x27;).forEach(item =&gt; { item.innerHTML = &#x27;&lt;i data-lucide=&quot;signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;wifi&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;battery-full&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;; });
  root.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; { button.type = &#x27;button&#x27;;button.classList.add(&#x27;cursor-interaction&#x27;); });
  root.addEventListener(&#x27;click&#x27;,event =&gt; {
    const destination = event.target.closest(&#x27;[data-go]&#x27;);
    if (destination) {
      const card = document.getElementById(destination.dataset.go);
      if (card) { selected = card.id;render();card.scrollIntoView({block:&#x27;start&#x27;,behavior:&#x27;instant&#x27;});status.textContent = &#x27;Viewing &#x27;+card.querySelector(&#x27;.ha-caption h3&#x27;).textContent+&#x27; · Illustrative preview&#x27;;persist(); }
      return;
    }

  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
