<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img" aria-labelledby="title desc">
  <title id="title">Your first Nap Plan</title>
  <desc id="desc">Open Rest and choose a prepared session, duration, rest sound, and optional alarm. Review the fixed route and deadline, then confirm. Start resting before the approved start and stay on screen until playback begins. For silence-only plans, wait for the rest-until-deadline state.</desc>
  <rect width="880" height="530" rx="24" fill="#f4f3f8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#242238">
    <text x="34" y="48" font-size="27" font-weight="700">A little curiosity. Then time to rest.</text>
    <text x="34" y="78" font-size="17" fill="#534f65">A guide to the prototype · not a screenshot</text>
    <rect x="28" y="105" width="402" height="174" rx="18" fill="#ffffff" stroke="#d9d5e5"/>
    <circle cx="62" cy="140" r="19" fill="#5b4d8a"/><text x="62" y="147" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
    <text x="94" y="147" font-size="23" font-weight="700">Open Rest</text>
    <text x="48" y="192" font-size="20">Start on the Rest tab.</text>
    <text x="48" y="221" font-size="20">Choose a prepared session.</text>
    <text x="48" y="254" font-size="17" fill="#534f65">History is the other tab.</text>
    <rect x="450" y="105" width="402" height="174" rx="18" fill="#ffffff" stroke="#d9d5e5"/>
    <circle cx="484" cy="140" r="19" fill="#5b4d8a"/><text x="484" y="147" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text>
    <text x="516" y="147" font-size="23" font-weight="700">Choose your rest</text>
    <text x="470" y="192" font-size="20">A session + a rest window.</text>
    <text x="470" y="221" font-size="20">Silence or Gentle rain.</text>
    <text x="470" y="254" font-size="17" fill="#534f65">Choose whether to request an alarm.</text>
    <rect x="28" y="297" width="402" height="174" rx="18" fill="#ffffff" stroke="#d9d5e5"/>
    <circle cx="62" cy="332" r="19" fill="#5b4d8a"/><text x="62" y="339" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text>
    <text x="94" y="339" font-size="23" font-weight="700">Review, then confirm</text>
    <text x="48" y="384" font-size="20">Check the full route and deadline.</text>
    <text x="48" y="413" font-size="20">Confirm the reviewed plan.</text>
    <text x="48" y="446" font-size="17" fill="#534f65">A short window may have no narration.</text>
    <rect x="450" y="297" width="402" height="174" rx="18" fill="#e5efeb" stroke="#b9cec5"/>
    <circle cx="484" cy="332" r="19" fill="#2e6152"/><text x="484" y="339" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">4</text>
    <text x="516" y="339" font-size="23" font-weight="700">Start resting</text>
    <text x="470" y="384" font-size="20">Start before the approved time.</text>
    <text x="470" y="413" font-size="20">Stay open until playback begins.*</text>
    <text x="470" y="446" font-size="17" fill="#355d50">Then you can lock the phone.</text>
    <text x="34" y="508" font-size="16" fill="#534f65">* Silence-only, no narration? Wait for the visible rest-until-deadline state.</text>
  </g>
</svg>
