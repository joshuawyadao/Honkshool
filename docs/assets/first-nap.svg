<svg xmlns="http://www.w3.org/2000/svg" width="880" height="530" viewBox="0 0 880 530" role="img" aria-labelledby="title desc">
  <title id="title">Your first nap timer</title>
  <desc id="desc">Open Rest. Choose duration, sound, and optional wake alarm on one screen. Tap Start resting and keep the app open until rain or silent rest begins.</desc>
  <rect width="880" height="530" rx="24" fill="#F6F2EA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172B49">
    <text x="34" y="48" font-size="27" font-weight="700">A little curiosity. Then time to rest.</text>
    <text x="34" y="78" font-size="17" fill="#53637A">A guide to the prototype · not a screenshot</text>
    <rect x="28" y="105" width="402" height="174" rx="18" fill="#FFFDFA" stroke="#D7D8D5"/>
    <circle cx="62" cy="140" r="19" fill="#172B49"/><text x="62" y="147" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
    <text x="94" y="147" font-size="23" font-weight="700">Open Rest</text>
    <text x="48" y="192" font-size="20">Start on the Rest tab.</text>
    <text x="48" y="221" font-size="20">Your timer is ready to set.</text>
    <text x="48" y="254" font-size="17" fill="#53637A">History is the other tab.</text>
    <rect x="450" y="105" width="402" height="174" rx="18" fill="#FFFDFA" stroke="#D7D8D5"/>
    <circle cx="484" cy="140" r="19" fill="#172B49"/><text x="484" y="147" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">2</text>
    <text x="516" y="147" font-size="23" font-weight="700">Choose your rest</text>
    <text x="470" y="192" font-size="20">A duration or exact wake time.</text>
    <text x="470" y="221" font-size="20">Silence or Gentle rain.</text>
    <text x="470" y="254" font-size="17" fill="#53637A">Choose whether to request an alarm.</text>
    <rect x="28" y="297" width="402" height="174" rx="18" fill="#FFFDFA" stroke="#D7D8D5"/>
    <circle cx="62" cy="332" r="19" fill="#172B49"/><text x="62" y="339" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">3</text>
    <text x="94" y="339" font-size="23" font-weight="700">Start resting</text>
    <text x="48" y="384" font-size="20">Tap Start resting once.</text>
    <text x="48" y="413" font-size="20">Allow alarm access if needed.</text>
    <text x="48" y="446" font-size="17" fill="#53637A">Your alarm is verified before audio.</text>
    <rect x="450" y="297" width="402" height="174" rx="18" fill="#E3EAF0" stroke="#D7D8D5"/>
    <circle cx="484" cy="332" r="19" fill="#172B49"/><text x="484" y="339" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">4</text>
    <text x="516" y="339" font-size="23" font-weight="700">Settle in</text>
    <text x="470" y="384" font-size="20">Rain or silent rest begins.</text>
    <text x="470" y="413" font-size="20">Stay open until playback begins.*</text>
    <text x="470" y="446" font-size="17" fill="#53637A">Then you can lock the phone.</text>
    <text x="34" y="508" font-size="16" fill="#53637A">* Choose Plan a narrated rest for prepared sessions and a full route review.</text>
  </g>
</svg>
